  function icon(name, size = 18, cls = "") {
    const body = ICONS[name] || ICONS["info"];
    return `<svg class="ico ${cls}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;
  }
  // Escape text for HTML templates.
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
  // h(html) → first element built from an HTML string
  function h(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; }
  const reducedMotion = () => (typeof matchMedia !== "undefined" && matchMedia("(prefers-reduced-motion: reduce)").matches) || !!(S.state.prefs && S.state.prefs.reduceMotion);

  // The P logo (forest rounded square, white P, lime dot). logo(size, withWord)
  function logo(size = 30, word = true) {
    const mark = `<svg width="${size}" height="${size}" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#0F2A1F"/><rect x=".5" y=".5" width="39" height="39" rx="10.5" fill="none" stroke="rgba(198,244,50,.25)"/><path d="M13 30V10h8.5a6.5 6.5 0 0 1 0 13H13" fill="none" stroke="#F5F4EF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="28.5" cy="29" r="3.6" fill="#C6F432"/></svg>`;
    return word ? `<span class="logo">${mark}<span class="logo-word">PARKLY</span></span>` : mark;
  }
  // Indian number plate chip. plate('DL 8C AF 4521', 'sm'|'lg'?)
  const plate = (p, size = "") => `<span class="plate${size ? " plate-" + size : ""}"><span class="plate-ind">IND</span><span class="plate-no">${esc(p)}</span></span>`;
  // Occupancy bar: "38 of 120 free"
  function occ(free, capacity, opts = {}) {
    const tone = toneClass(availTone(free, capacity));
    const pct = capacity ? Math.max(0, Math.min(100, Math.round((free / capacity) * 100))) : 0; // bar length = share free
    const label = free <= 0 ? "Full for your time" : `<b>${free}</b> of ${capacity} free`;
    return `<div class="occ occ-${tone} ${opts.cls || ""}" role="img" aria-label="${free} of ${capacity} spaces free"><div class="occ-track"><div class="occ-fill" style="width:${pct}%"></div></div><div class="occ-label">${label}</div></div>`;
  }
  // Star rating "★ 4.6 (1,284)"
  function stars(r, count, opts = {}) {
    const full = Math.round(r);
    const row = opts.row ? `<span class="stars-row">${[1, 2, 3, 4, 5].map((i) => `<i class="${i <= full ? "on" : ""}">★</i>`).join("")}</span>` : `<i class="on">★</i>`;
    return `<span class="stars">${row}<b>${r.toFixed(1)}</b>${count !== undefined ? `<span class="muted">(${Number(count).toLocaleString("en-IN")})</span>` : ""}</span>`;
  }
  const badge = (text, tone = "neutral", ico) => `<span class="badge badge-${tone}">${ico ? icon(ico, 13) : ""}${esc(text)}</span>`;
  const statusBadge = (b) => {
    const st = bookingStatus(b);
    return isOverstay(b) ? badge("Overstay", "danger", "triangle-alert") : badge(D.statusLabels[st], statusTone(st));
  };
  // Itemised bill from quote().lines
  function bill(q, opts = {}) {
    const rows = q.lines.map((l) => `<div class="bill-row${l.amount < 0 ? " is-neg" : ""}"><div><div class="bill-label">${esc(l.label)}</div>${l.hint ? `<div class="bill-hint">${esc(l.hint)}</div>` : ""}</div><div class="bill-amt">${l.amount < 0 ? "− " + money(-l.amount) : money(l.amount)}</div></div>`).join("");
    return `<div class="bill">${rows}<div class="bill-total"><span>${esc(opts.totalLabel || "Total")}</span><span class="bill-amt" data-roll>${money(q.total)}</span></div></div>`;
  }
  // Amenity icon list for a facility → [{icon, label}]
  function amenityIcons(f) {
    const out = [];
    if (f.ev) out.push({ icon: "zap", label: "EV charging" });
    if (f.accessible) out.push({ icon: "accessibility", label: "Accessible" });
    if (f.motorcycle) out.push({ icon: "bike", label: "Two-wheelers" });
    if (f.covered) out.push({ icon: "umbrella", label: "Covered" });
    if (f.security.includes("cctv")) out.push({ icon: "video", label: "CCTV" });
    if (f.security.includes("guarded")) out.push({ icon: "shield-check", label: "Guarded" });
    if (f.overnight) out.push({ icon: "moon", label: "Overnight" });
    return out;
  }

  /* rollNumber(el, newText): animated swap of a number/price (old rolls up, new rolls in). */
  function rollNumber(el, text) {
    if (!el) return;
    text = String(text);
    const old = el.dataset.val ?? el.textContent;
    if (old === text) return;
    el.dataset.val = text;
    if (reducedMotion()) { el.textContent = text; return; }
    el.classList.add("roll");
    el.innerHTML = `<span class="roll-old">${esc(old)}</span><span class="roll-new">${esc(text)}</span>`;
    clearTimeout(el._rollT);
    el._rollT = setTimeout(() => { el.classList.remove("roll"); el.textContent = text; }, 360);
  }

  /* ─────────────────── 11. TOAST + OVERLAY ─────────────────── */
  // toast(text, tone='info'|'ok'|'warn'|'danger', action?{label, onClick}, ms=3200)
  function toast(text, tone = "info", action, ms = 3200) {
    let host = document.querySelector(".toast-host");
    if (!host) { host = document.createElement("div"); host.className = "toast-host"; host.setAttribute("aria-live", "polite"); (document.querySelector(".device") || document.body).appendChild(host); }
    const ic = { ok: "circle-check", warn: "triangle-alert", danger: "circle-x", info: "info" }[tone] || "info";
    const t = h(`<div class="toast toast-${tone}" role="status">${icon(ic, 18)}<span class="toast-text">${esc(text)}</span>${action ? `<button class="toast-act">${esc(action.label)}</button>` : ""}</div>`);
    if (action) t.querySelector(".toast-act").onclick = () => { action.onClick(); close(); };
    host.appendChild(t);
    const close = () => { t.classList.add("is-out"); setTimeout(() => t.remove(), 240); };
    setTimeout(close, ms);
    return close;
  }

  /* Overlay: one API for mobile bottom sheets and desktop modals.
     openSheet({title, body (html|Node), footer (html|Node), kind:'sheet'|'modal'|'auto', size:'sm'|'md'|'lg', onClose, dismissable})
     → {el, body, footer, close()}. 'auto' = modal on body.d, sheet otherwise. Esc and backdrop close it. */
  const overlayStack = [];
  function openSheet(o = {}) {
    const kind = o.kind && o.kind !== "auto" ? o.kind : document.body.classList.contains("d") ? "modal" : "sheet";
    const host = document.querySelector(".device") || document.body;
    const wrap = h(`<div class="overlay overlay-${kind}" role="presentation"><div class="overlay-backdrop"></div>
      <div class="${kind} ${o.size ? kind + "-" + o.size : ""}" role="dialog" aria-modal="true" ${o.title ? `aria-label="${esc(o.title)}"` : ""} tabindex="-1">
        ${kind === "sheet" ? '<div class="sheet-grip" aria-hidden="true"></div>' : ""}
        ${o.title ? `<div class="${kind}-head"><h2 class="${kind}-title">${esc(o.title)}</h2><button class="btn btn-ghost btn-icon btn-sm" data-close aria-label="Close">${icon("x", 18)}</button></div>` : ""}
        <div class="${kind}-body"></div>
        <div class="${kind}-foot"></div>
      </div></div>`);
    const panel = wrap.querySelector("." + kind), body = wrap.querySelector(`.${kind}-body`), foot = wrap.querySelector(`.${kind}-foot`);
    const put = (slot, c) => { if (c == null) return; if (typeof c === "string") slot.innerHTML = c; else slot.appendChild(c); };
    put(body, o.body); put(foot, o.footer);
    if (!o.footer) foot.remove();
    const prevFocus = document.activeElement;
    let closed = false;
    const api = {
      el: panel, body, footer: foot,
      close() {
        if (closed) return; closed = true;
        wrap.classList.add("is-closing");
        const i = overlayStack.indexOf(api); if (i >= 0) overlayStack.splice(i, 1);
        setTimeout(() => wrap.remove(), reducedMotion() ? 0 : 220);
        if (prevFocus && prevFocus.focus) try { prevFocus.focus(); } catch {}
        o.onClose && o.onClose();
      },
    };
    if (o.dismissable !== false) wrap.querySelector(".overlay-backdrop").onclick = api.close;
    wrap.querySelectorAll("[data-close]").forEach((b) => (b.onclick = api.close));
    host.appendChild(wrap);
    overlayStack.push(api);
    requestAnimationFrame(() => panel.focus({ preventScroll: true }));
    return api;
  }
  const closeTopSheet = () => { const t = overlayStack[overlayStack.length - 1]; if (t) { t.close(); return true; } return false; };
  // confirmDialog({title, body, confirm:'Cancel booking', tone:'danger', cancel:'Keep'}) → Promise<boolean>
  function confirmDialog(o) {
    return new Promise((res) => {
      let done = false;
      const s = openSheet({ title: o.title, size: "sm", body: `<div class="confirm-body">${o.body || ""}</div>`,
        footer: `<button class="btn btn-secondary btn-md" data-no>${esc(o.cancel || "Go back")}</button><button class="btn btn-${o.tone || "primary"} btn-md" data-yes>${esc(o.confirm || "Confirm")}</button>`,
        onClose: () => { if (!done) res(false); } });
      s.footer.querySelector("[data-no]").onclick = () => { done = true; res(false); s.close(); };
      s.footer.querySelector("[data-yes]").onclick = () => { done = true; res(true); s.close(); };
    });
  }
  if (typeof document !== "undefined") document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeTopSheet(); });

  /* ───────────────────────── 10. ROUTER ───────────────────────── */
  /* Hash router. Router.on(fn(route)) where route = {path, name, params, query, parts}.
     Names: welcome, landing, explore, map, parking, reserve, checkout, confirmation, bookings, booking, arrive,
            saved, compare, notifications, profile. Router.go('#/parking/khan') or Router.go('/parking/khan'). */
  const ROUTES = [
    ["^/?$", "landing"], ["^/welcome$", "welcome"], ["^/explore$", "explore"], ["^/map$", "map"],
    ["^/parking/([^/]+)$", "parking", ["id"]], ["^/reserve/([^/]+)$", "reserve", ["id"]], ["^/checkout/([^/]+)$", "checkout", ["id"]],
    ["^/confirmation/([^/]+)$", "confirmation", ["id"]], ["^/bookings$", "bookings"], ["^/bookings/([^/]+)/arrive$", "arrive", ["id"]],
    ["^/bookings/([^/]+)$", "booking", ["id"]], ["^/saved$", "saved"], ["^/compare$", "compare"], ["^/notifications$", "notifications"], ["^/profile$", "profile"],
  ].map(([re, name, keys]) => ({ re: new RegExp(re), name, keys: keys || [] }));
  const Router = {
    handlers: [], current: null,
    parse(hash = location.hash) {
      const raw = (hash || "").replace(/^#/, "") || "/";
      const [path, qs] = raw.split("?");
      const query = Object.fromEntries(new URLSearchParams(qs || ""));
      for (const r of ROUTES) {
        const m = path.match(r.re);
        if (m) return { path, name: r.name, params: Object.fromEntries(r.keys.map((k, i) => [k, decodeURIComponent(m[i + 1])])), query, parts: path.split("/").filter(Boolean) };
      }
      return { path, name: "notfound", params: {}, query, parts: path.split("/").filter(Boolean) };
    },
    // go(path, query?) — path like '/parking/khan' or '#/parking/khan'; query object becomes ?a=b
    go(path, query) {
      let p = String(path).replace(/^#/, "");
      if (query) p += "?" + new URLSearchParams(query).toString();
      if ("#" + p === location.hash) Router.render(); else location.hash = p;
    },

<script>

function openWhen(onDone) {

        <div><div class="lbl mb-8">Day</div><div class="datestrip">${days.map((d) => `<button type="button" data-day="${d}" class="${d === day ? "is-on" : ""}"><small>${i18day(d)}</small><b>${new Date(d).getDate()}</b></button>`).join("")}</div></div>

    </div>`);
  const sel = $("#w-tk", body);
  const fillTimes = () => { const ts = times(); if (!ts.includes(tk)) tk = ts[0] || "10:00"; sel.innerHTML = ts.map((t) => `<option value="${t}" ${t === tk ? "selected" : ""}>${fmt.time12(t)}</option>`).join(""); };
  const sync = () => {
    $$("#w-chips .chip", body).forEach((c) => c.classList.toggle("is-on", +c.dataset.h * 60 === dur));
    const s = startMs();
    $("#w-sum span", body).innerHTML = `Enter after <b class="mono">${fmt.dayLabel(s)} ${fmt.timeLabel(s)}</b> · exit before <b class="mono">${fmt.timeLabel(s + dur * MIN)}</b>${fmt.dayLabel(s + dur * MIN) !== fmt.dayLabel(s) ? " " + fmt.dayLabel(s + dur * MIN) : ""}`;
    dial.update({ startMs: s });

  const dial = Dial.mount($("#w-dial", body), { valueMin: dur, minMin: 30, maxMin: 1440, stepMin: 30, startMs: startMs(), onChange: (v) => { dur = v; sync(); } });
  $$("[data-day]", body).forEach((b) => b.onclick = () => { day = +b.dataset.day; $$("[data-day]", body).forEach((x) => x.classList.toggle("is-on", x === b)); fillTimes(); sync(); });
  sel.onchange = () => { tk = sel.value; sync(); };

  sync();

}

  mount(root) {
    bindTop(root);
    $$("[data-save]", root).forEach((b) => b.onclick = () => { const id = b.dataset.save; A.toggleSaved(id); P.toast("Removed from saved", "info", { label: "Undo", onClick: () => A.toggleSaved(id) }); });
    $$("[data-quick]", root).forEach((b) => b.onclick = () => { draft = null; Router.go("/reserve/" + b.dataset.quick); });
    $$("[data-alert]", root).forEach((c) => c.onchange = () => A.toggleSearchAlert(c.dataset.alert));
    $$("[data-run]", root).forEach((b) => b.onclick = () => { A.runSavedSearch(b.dataset.run); Router.go("/explore"); });
    $$("[data-rm]", root).forEach((b) => b.onclick = () => { A.removeSearch(b.dataset.rm); P.toast("Search deleted", "info"); });
    const c = $("[data-check]", root); if (c) c.onclick = () => { const n = A.checkAlerts(); P.toast(n ? `${plural(n, "new alert")}. See Notifications.` : "No changes since the last check.", n ? "ok" : "info", n ? { label: "Open", onClick: () => Router.go("/notifications") } : undefined); };
  },
};

/* ── 9. COMPARE ── */
Views.compare = {
  title: "Compare · PARKLY",
  render() {
    const s = st(), w = win(), ids = s.compareIds;
    if (ids.length < 2) return `${topbar({ title: "Compare" })}<div class="page"><div class="page-head"><div><h1 class="h1d">Compare</h1><p>See up to three places side by side.</p></div></div>
      <div class="card">${emptyState("columns", ids.length ? "Add one more place" : "Nothing to compare yet", `Tick <b>Compare</b> on two or three results in Explore. ${ids.length ? `You have <b>${esc(P.facility(ids[0]).name)}</b> so far.` : ""}`, `<a class="btn btn-primary btn-md" href="#/explore">Go to Explore</a>`)}</div></div>`;
    const cols = ids.map((id) => { const f = P.facility(id), m = P.measure(f, s.search, s.bookings, s.demo.seed, vtype()), pol = D.policies[f.policy]; return { f, m, pol, q: windowQuote(f) }; });
    const rows = [
      ["Total for your time", (c) => c.q.total, "min", (c) => `<span class="num" style="font-size:24px">${rup(c.q.total)}</span>`],
      ["Per hour", (c) => c.m.rate, "min", (c) => `<span class="mono">${money(c.m.rate)}</span>`],
      ["Per day", (c) => P.dailyFor(c.f, vtype()) || 1e9, "min", (c) => `<span class="mono">${c.f.dailyRate ? money(P.dailyFor(c.f, vtype())) : "Hourly only"}</span>`],
      ["Distance", (c) => c.m.km, "min", (c) => `<span class="mono">${fmt.kmLabel(c.m.km)} · ${c.m.walk} min walk</span>`],
      ["Free spaces", (c) => c.m.free, "max", (c) => P.occ(c.m.free, c.f.capacity)],
      ["Rating", (c) => c.f.rating, "max", (c) => P.stars(c.f.rating, c.f.reviewCount)],
      ["Type", null, null, (c) => esc(D.typeLabels[c.f.type] || c.f.type)],
      ["Hours", null, null, (c) => esc(P.hoursLabel(c.f))],
      ["Security", (c) => c.f.security.length, "max", (c) => c.f.security.map((x) => D.securityLabels[x]).join(", ")],
      ["EV charging", (c) => (c.f.ev ? c.f.ev.count : 0), "max", (c) => (c.f.ev ? `${c.f.ev.count} × ${c.f.ev.kw} kW` : `<span class="muted">No</span>`)],
      ["Height limit", null, null, (c) => (c.f.heightLimit ? `${c.f.heightLimit} m` : "No limit")],
      ["Cancellation", (c) => ({ flexible: 3, moderate: 2, strict: 1 }[c.f.policy]), "max", (c) => `${c.pol.title}<div class="tiny muted">${esc(c.pol.rules[0])}</div>`],
    ];
    const tick = `<span class="tick">${icon("check", 13)}</span>`;
    return `${topbar({ title: "Compare" })}<div class="page"><div class="page-head"><div><h1 class="h1d">Compare ${cols.length} places</h1><p>${esc(winText())} · ${esc(P.defaultVehicle().name)}. Lime cells are the best value in each row.</p></div><button class="btn btn-ghost btn-md" data-clear>${icon("trash", 16)}Clear all</button></div>
      <div class="card" style="overflow:hidden"><table class="cmp"><thead><tr><th></th>${cols.map((c) => `<th><div class="illus-frame">${Illus.facility(c.f)}</div><a class="h3" href="#/parking/${c.f.id}" style="color:var(--ink)">${esc(c.f.name)}</a><div class="small muted">${esc(c.f.area)}</div></th>`).join("")}</tr></thead>
      <tbody>${rows.map(([label, val, dir, cell]) => { let best = null; if (val) { const vs = cols.map(val); const b = dir === "min" ? Math.min(...vs) : Math.max(...vs); if (vs.filter((x) => x === b).length < vs.length) best = b; }
        return `<tr><th scope="row">${label}</th>${cols.map((c) => `<td class="${best !== null && val(c) === best ? "is-best" : ""}">${cell(c)}${best !== null && val(c) === best ? tick : ""}</td>`).join("")}</tr>`; }).join("")}
      <tr><th></th>${cols.map((c) => `<td><div class="row gap-8"><button class="btn btn-primary btn-md grow" data-res="${c.f.id}" ${c.m.free <= 0 ? "disabled" : ""}>${c.m.free > 0 ? "Reserve" : "Full"}</button><button class="btn btn-ghost btn-icon btn-md" data-rm="${c.f.id}" aria-label="Remove">${icon("x", 17)}</button></div></td>`).join("")}</tr></tbody></table></div></div>`;
  },
  mount(root) {
    bindTop(root);
    $$("[data-res]", root).forEach((b) => b.onclick = () => { draft = null; Router.go("/reserve/" + b.dataset.res); });
    $$("[data-rm]", root).forEach((b) => b.onclick = () => A.toggleCompare(b.dataset.rm));
    const c = $("[data-clear]", root); if (c) c.onclick = () => A.clearCompare();
  },
};

/* ── 10. NOTIFICATIONS ── */
const N_ICON = { confirmed: "calendar-check", availability: "sparkles", reminder: "alarm-clock", cancelled: "circle-x", price: "tag", extended: "timer", modified: "pencil", ending: "triangle-alert" };
Views.notifications = {
  title: "Notifications · PARKLY",
  render() {
    const list = st().notifications, unread = P.unreadCount();
    return `${topbar({ title: "Notifications" })}<div class="page" style="max-width:900px"><div class="page-head"><div><h1 class="h1d">Notifications</h1><p>${unread ? `${unread} unread` : "You're all caught up"}</p></div>
      <div class="row gap-8">${unread ? `<button class="btn btn-secondary btn-md" data-all>${icon("check-check", 16)}Mark all read</button>` : ""}${list.length ? `<button class="btn btn-ghost btn-md" data-clear>${icon("trash", 16)}Clear all</button>` : ""}</div></div>
      <div class="card">${list.length ? list.map((n) => `<div class="nt ${n.read ? "" : "is-unread"}" data-n="${n.id}"><div class="icon-tile ${n.read ? "" : "is-lime"}" ${n.kind === "ending" || n.kind === "cancelled" ? 'style="color:var(--warn)"' : ""}>${icon(N_ICON[n.kind] || "bell", 18)}</div>
        <div><div class="nt-title">${esc(n.title)}</div><div class="small ink-2">${esc(n.body)}</div><div class="tiny muted mono mt-4">${fmt.ago(n.at)}</div></div>
        <div class="nt-acts">${n.read ? "" : `<button class="btn btn-ghost btn-icon btn-sm" data-read="${n.id}" aria-label="Mark read" title="Mark read">${icon("check", 16)}</button>`}<button class="btn btn-ghost btn-icon btn-sm" data-del="${n.id}" aria-label="Delete" title="Delete">${icon("trash", 16)}</button></div></div>`).join("")
        : emptyState("bell-off", "No notifications", "Booking updates, reminders and price alerts will show up here.")}</div></div>`;
  },
  mount(root) {
    bindTop(root);
    $$("[data-n]", root).forEach((r) => r.onclick = (e) => { if (e.target.closest("button")) return; const n = st().notifications.find((x) => x.id === r.dataset.n); A.markRead(n.id); if (n.bookingId && P.getBooking(n.bookingId)) Router.go("/bookings/" + n.bookingId); else if (n.facilityId) Router.go("/parking/" + n.facilityId); });
    $$("[data-read]", root).forEach((b) => b.onclick = () => A.markRead(b.dataset.read));
    $$("[data-del]", root).forEach((b) => b.onclick = () => A.removeNotification(b.dataset.del));
    const a = $("[data-all]", root); if (a) a.onclick = () => A.markAllRead();
    const c = $("[data-clear]", root); if (c) c.onclick = async () => { if (await P.confirmDialog({ title: "Clear all notifications?", body: "This removes every notification. Your bookings are not affected.", confirm: "Clear all", tone: "danger", cancel: "Keep them" })) A.clearNotifications(); };
  },
};

/* ── 11. PROFILE ── */
const prof = { taps: 0, dev: false };
const FAQ = [
  ["Is my space really guaranteed?", "Yes. When you book, a bay is held for your exact time. If the lot can't give you a space, you get a full refund and ₹100 credit."],
  ["What if I arrive late?", "Your bay is held for your whole booking. You can enter any time between your entry and exit time."],
  ["What if I stay longer?", "Extend from the booking page before your time ends. If you overstay, there are 15 free minutes, then each started hour costs 1.5× the rate."],
  ["How do refunds work?", "It depends on the lot's policy: Flexible, Moderate or Strict. The exact refund is shown before you confirm a cancellation. The ₹18 convenience fee is not refunded."],
  ["Can I change my car or time?", "Yes, for upcoming bookings. You'll see the price difference before you save."],
];
Views.profile = {
  title: "Profile · PARKLY",
  render() {
    const s = st(), off = s.demo.clockOffsetMin, nx = s.prefs.notify;
    const sw = (k, label, sub, on, attr = "data-nf") => `<label class="switch switch-row" style="padding:6px 0"><span><span class="strong">${label}</span>${sub ? `<br><span class="tiny muted">${sub}</span>` : ""}</span><input type="checkbox" ${attr}="${k}" ${on ? "checked" : ""}><span class="switch-track"></span></label>`;
    return `${topbar({ title: "Profile" })}<div class="page"><div class="two-col" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)">
    <div class="stack-24">
      <section class="card prof-user"><span class="avatar">${esc(s.user.name[0])}</span><div class="grow"><div class="h2">${esc(s.user.name)}</div><div class="small muted">${esc(s.user.email)} · ${esc(s.user.phone)}</div></div>${P.badge(`${s.bookings.length} bookings`, "lime")}</section>
      <section class="card sec-card"><div class="card-head"><h2 class="card-title">Vehicles</h2><button class="btn btn-secondary btn-sm" data-addv>${icon("plus", 15)}Add</button></div>
        <div class="list">${s.vehicles.map((v) => `<div class="list-row" style="padding-inline:0"><span class="ico-wrap">${icon(v.type === "motorcycle" ? "bike" : v.type === "ev" ? "zap" : "car", 18)}</span><div class="grow"><b>${esc(v.name)}</b> ${v.id === s.defaultVehicleId ? P.badge("Default", "lime") : ""}<div class="row gap-8 mt-4" style="flex-wrap:wrap">${P.plate(v.plate, "sm")}<span class="tiny muted">${D.vehicleLabels[v.type]}</span></div></div>
          ${v.id === s.defaultVehicleId ? "" : `<button class="btn btn-ghost btn-sm" data-def="${v.id}">Make default</button>`}<button class="btn btn-ghost btn-icon btn-sm" data-editv="${v.id}" aria-label="Edit">${icon("pencil", 15)}</button><button class="btn btn-ghost btn-icon btn-sm" data-rmv="${v.id}" aria-label="Remove">${icon("trash", 15)}</button></div>`).join("")}</div></section>
      <section class="card sec-card"><h2 class="card-title mb-12">Payment</h2><div class="seg seg-block">${D.paymentMethods.map((m) => `<button class="${s.prefs.payment === m.id ? "is-on" : ""}" data-pm="${m.id}">${esc(m.label)}</button>`).join("")}</div><p class="small muted mt-12">${esc((D.paymentMethods.find((m) => m.id === s.prefs.payment) || {}).detail || "")} is used by default at checkout.</p></section>
      <section class="card sec-card"><h2 class="card-title mb-12">Saved places</h2>${s.savedPlaces.map((p) => `<div class="field mb-12"><label class="lbl">${icon(p.label === "Home" ? "house" : "briefcase", 14)} ${esc(p.label)}</label><select class="select" data-sp="${p.id}">${D.destinations.map((d) => `<option value="${d.id}" ${d.id === p.destId ? "selected" : ""}>${esc(d.name)}</option>`).join("")}</select></div>`).join("")}</section>
    </div>
    <div class="stack-24">
      <section class="card sec-card"><h2 class="card-title mb-8">Notifications</h2>${sw("reminders", "Booking reminders", "1 hour before entry and 15 minutes before exit", nx.reminders)}${sw("updates", "Booking updates", "Confirmations, changes and refunds", nx.updates)}${sw("priceAlerts", "Price alerts", "From your saved searches", nx.priceAlerts)}${sw("availability", "Space alerts", "When saved spots free up", nx.availability)}</section>
      <section class="card sec-card"><h2 class="card-title mb-8">Display</h2>${sw("largeText", "Larger text", "Easier to read", s.prefs.largeText, "data-pf")}${sw("reduceMotion", "Reduce motion", "Turns off moving effects", s.prefs.reduceMotion, "data-pf")}</section>
      <section class="card sec-card dev" id="dev" ${prof.dev || off || s.demo.nextPaymentFails ? "" : "hidden"}><div class="card-head"><h2 class="card-title">${icon("sliders-horizontal", 17)} Developer options</h2>${P.badge("Demo only", "warn")}</div>
        <div class="row-between mb-16"><div><div class="lbl">Test clock</div><div class="dev-clock mt-4" id="dev-clock">${fmt.dayLabel(P.now())}, ${fmt.timeLabel(P.now())}</div><div class="tiny mono ${off ? "t-warn" : "muted"} mt-4">${off ? `${off > 0 ? "+" : "−"}${fmt.durationShort(Math.abs(off))} from real time` : "Real time"}</div></div></div>
        <div class="chip-row mb-16"><button class="chip chip-sm" data-adv="30">+30 min</button><button class="chip chip-sm" data-adv="60">+1 hour</button><button class="chip chip-sm" data-adv="180">+3 hours</button><button class="chip chip-sm" data-jump>Jump to 10 min before next event</button><button class="chip chip-sm" data-real>Back to real time</button></div>
        ${sw("nextPaymentFails", "Fail the next payment", "Checkout will show the payment-failed screen once", s.demo.nextPaymentFails, "data-demo")}
        <div class="row gap-8 mt-12"><button class="btn btn-secondary btn-sm" data-refresh>${icon("refresh-cw", 15)}Refresh availability</button><button class="btn btn-danger btn-sm" data-reset>${icon("rotate-ccw", 15)}Reset all data</button></div></section>
      <section class="card sec-card"><h2 class="card-title mb-4">Help</h2>${FAQ.map(([q, a]) => `<details class="faq"><summary>${esc(q)}${icon("chevron-down", 16)}</summary><p>${esc(a)}</p></details>`).join("")}</section>
      <section class="card sec-card row-between"><div class="row gap-16 small"><button class="link" data-doc="terms">Terms of use</button><button class="link" data-doc="privacy">Privacy</button></div><span class="mono tiny muted ver" data-ver title="Tap 5 times for developer options">PARKLY v1.0 (desktop)</span><button class="btn btn-ghost btn-sm" data-out>${icon("log-out", 15)}Sign out</button></section>
    </div></div></div>`;
  },
  mount(root, route, ctx) {
    bindTop(root);
    const on = (sel, fn) => $$(sel, root).forEach((x) => x.addEventListener(x.matches("input,select") ? "change" : "click", () => fn(x)));
    on("[data-addv]", () => vehicleModal(null));
    on("[data-editv]", (b) => vehicleModal(st().vehicles.find((v) => v.id === b.dataset.editv)));
    on("[data-rmv]", async (b) => { const v = st().vehicles.find((x) => x.id === b.dataset.rmv); if (await P.confirmDialog({ title: `Remove ${v.name}?`, body: `${esc(v.plate)} will be removed from your profile.`, confirm: "Remove", tone: "danger", cancel: "Keep" })) { const r = A.removeVehicle(v.id); P.toast(r.ok ? "Vehicle removed" : r.error, r.ok ? "ok" : "warn"); } });
    on("[data-def]", (b) => { A.setDefaultVehicle(b.dataset.def); P.toast("Default vehicle changed. Prices now use this car.", "ok"); });
    on("[data-pm]", (b) => A.setPrefs({ payment: b.dataset.pm }));
    on("[data-sp]", (x) => { A.setSavedPlace(x.dataset.sp, x.value); P.toast("Saved place updated", "ok"); });
    on("[data-nf]", (x) => A.setNotify({ [x.dataset.nf]: x.checked }));
    on("[data-pf]", (x) => A.setPrefs({ [x.dataset.pf]: x.checked }));
    on("[data-demo]", (x) => { A.setDemo({ [x.dataset.demo]: x.checked }); P.toast(x.checked ? "The next payment will fail" : "Payments work normally", "info"); });
    on("[data-adv]", (b) => { A.advanceClock(+b.dataset.adv); P.toast(`Clock moved ${fmt.durationShort(+b.dataset.adv)} ahead`, "info"); });
    on("[data-jump]", () => { const r = A.jumpToNextEvent(); P.toast(r || "No upcoming or active booking to jump to", r ? "info" : "warn"); });
    on("[data-real]", () => { A.setClockOffset(0); P.toast("Back to real time", "info"); });
    on("[data-refresh]", () => { A.refreshAvailability(); P.toast("Availability refreshed", "ok"); });
    on("[data-reset]", async () => { if (await P.confirmDialog({ title: "Reset all data?", body: "Bookings, vehicles and settings go back to the demo start. This can't be undone.", confirm: "Reset", tone: "danger" })) { A.resetDemo(); draft = null; P.toast("Demo data reset", "ok"); } });
    on("[data-ver]", () => { if (++prof.taps >= 5 && !prof.dev) { prof.dev = true; $("#dev", root).hidden = false; $("#dev", root).scrollIntoView({ behavior: "smooth", block: "center" }); P.toast("Developer options unlocked", "ok"); } });
    on("[data-doc]", (b) => P.openSheet({ title: b.dataset.doc === "terms" ? "Terms of use" : "Privacy", body: `<div class="stack-12 ink-2 small">${(b.dataset.doc === "terms"
      ? ["PARKLY is a design prototype. No real bookings or payments are made.", "Prices include the convenience fee and 18% GST. The convenience fee is not refunded.", "Overstay: 15 minutes' grace, then every started hour at 1.5× the hourly rate.", "Refunds follow each lot's cancellation policy, shown before you pay."]
      : ["This prototype stores your demo data only in this browser (localStorage).", "Nothing is sent to a server. Clearing site data or Reset removes it.", "Location is simulated: Near me always uses Mandi House."]).map((x) => `<p>${x}</p>`).join("")}</div>` }));
    on("[data-out]", async () => { if (await P.confirmDialog({ title: "Sign out?", body: "Your demo bookings stay on this device.", confirm: "Sign out" })) { A.signOut(); Router.go("/"); } });
    ctx.every(1000, () => { const c = $("#dev-clock", root); if (c) c.textContent = `${fmt.dayLabel(P.now())}, ${fmt.timeLabel(P.now())}`; });
  },
  onState(s, why, prev) { if (why === "tick" || why === "notify") return; rerender(); },
};


/* ═════════ router + lifecycle ═════════ */
const VIEW_OF = { landing: "landing", welcome: "landing", explore: "explore", map: "map", parking: "parking", reserve: "reserve", checkout: "checkout", confirmation: "confirmation",
  bookings: "bookings", booking: "bookings", arrive: "bookings", saved: "saved", compare: "compare", notifications: "notifications", profile: "profile" };
function mountRoute(route, prev) {
  if (route.name === "welcome") { Router.replace("/"); return; }
  if (cur) { cur.cleanups.forEach((fn) => { try { fn(); } catch (e) { console.error(e); } }); if (io) { io.disconnect(); io = null; } }
  const key = VIEW_OF[route.name], V = Views[key];
  app.classList.toggle("no-sidebar", key === "landing");
  const ctx = { cleanups: [], on(fn) { this.cleanups.push(fn); }, every(ms, fn) { const t = setInterval(fn, ms); this.cleanups.push(() => clearInterval(t)); } };
  cur = { name: key, route, V, ctx, cleanups: ctx.cleanups };
  if (!V) { main.innerHTML = `${topbar({ title: "Page not found" })}<div class="page">${emptyState("map-pin", "This page doesn't exist", "The link may be old. Start a new search instead.", `<a class="btn btn-primary btn-md" href="#/explore">Find parking</a>`)}</div>`; bindTop(main); renderSidebar(); return; }
  main.innerHTML = V.render(route, ctx);
  try { V.mount && V.mount(main, route, ctx); } catch (e) { console.error(e); }
  document.title = typeof V.title === "function" ? V.title(route) : V.title || "PARKLY";
  renderSidebar();
}
function rerender() { if (!cur) return; const y = window.scrollY; mountRoute(cur.route); window.scrollTo(0, y); }
S.subscribe((s, why, prev) => {
  renderSidebar();
  if (!cur || !cur.V) return;
  if (why === "reset") { rerender(); return; }
  if (cur.V.onState) { try { cur.V.onState(s, why, prev, main, cur.ctx); } catch (e) { console.error(e); } }
  else rerender();
});
setInterval(() => { const t = $("#sb-time"); if (t) t.textContent = fmt.timeLabel(P.now()); }, 5000);

/* ═════════ global keys + magnetic buttons ═════════ */
document.addEventListener("keydown", (e) => {
  const tag = (e.target.tagName || "").toLowerCase(), typing = tag === "input" || tag === "textarea" || tag === "select" || e.target.isContentEditable;
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "/") {
    e.preventDefault();
    const i = $(".js-where", main);
    if (i) i.focus(); else Router.go("/explore");
    return;
  }
  const mp = cur && cur.ctx.map;
  if (mp && ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "+", "=", "-"].includes(e.key) && !$(".overlay") && !e.target.closest(".dial,.map")) {
    if (cur.name === "landing") return;
    e.preventDefault(); mp.el.dispatchEvent(new KeyboardEvent("keydown", { key: e.key, bubbles: false }));
  }
});
document.addEventListener("pointermove", (e) => {
  if (reduced()) return;
  $$(".btn.is-mag").forEach((b) => {
    const r = b.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2, dx = e.clientX - cx, dy = e.clientY - cy;
    const near = Math.abs(dx) < r.width / 2 + 30 && Math.abs(dy) < r.height / 2 + 30;
    b.style.translate = near && !b.disabled ? `${clamp(dx * 0.12, -6, 6).toFixed(1)}px ${clamp(dy * 0.25, -6, 6).toFixed(1)}px` : "";
  });
}, { passive: true });

Router.on(mountRoute);
Router.start();
window.PARKLY_DESKTOP = { Views, rerender };
})();
</script>
