<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PARKLY · Parking in Delhi NCR</title>
<meta name="description" content="PARKLY desktop prototype: find, compare and pre-book parking in Delhi NCR. Fixed price, guaranteed space, scan to enter.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Onest:wght@400;500;600;700&family=Schibsted+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
<!--#include core.css-->

<style>
/* ═════════ PARKLY desktop · screen CSS (core.css holds tokens + components) ═════════ */
:root { --e-std: cubic-bezier(.2, 0, 0, 1); --e-in: cubic-bezier(0, 0, .2, 1); --e-spring: cubic-bezier(.34, 1.56, .64, 1);
  --glow-soft: 0 0 0 1px #C6F43233, 0 8px 32px #C6F43214; --wrap: 1280px; }
body.d { font-size: 16px; line-height: 1.55; }
@keyframes d-rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@keyframes pass-in { 0% { opacity: 0; transform: translateY(80px) rotate(0deg) scale(.94); } 70% { opacity: 1; transform: translateY(-6px) rotate(7deg); } 100% { opacity: 1; transform: rotate(6deg); } }
@keyframes scan { 0% { top: 0; opacity: 0; } 15% { opacity: 1; } 100% { top: 100%; opacity: 0; } }
@keyframes route-walk { to { stroke-dashoffset: -16; } }
@keyframes float-y { 50% { transform: translateY(-6px); } }
@keyframes route-in { from { opacity: 0; } to { opacity: 1; } }
.rv { animation: d-rise 600ms var(--e-in) both; animation-delay: calc(var(--d, 0) * 75ms); }
.sr { opacity: 0; transform: translateY(16px); transition: opacity 600ms var(--e-in), transform 600ms var(--e-in); }
.sr.is-in { opacity: 1; transform: none; }
html[data-motion="reduce"] .sr { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { .sr { opacity: 1; transform: none; } }
.map-route { animation: route-in 900ms var(--e-in) both, route-walk 1.2s linear infinite; }
.card-hover { transition: border-color 150ms, transform 150ms var(--e-std), box-shadow 240ms var(--e-std); }
.card-hover:hover { transform: translateY(-2px); border-color: rgba(245, 244, 239, .16); box-shadow: var(--glow-soft); }
.btn.is-mag { transition: translate 240ms var(--e-std), background 150ms, box-shadow 240ms, transform 100ms; }
.cur { font-size: .6em; vertical-align: .36em; margin-right: 1px; font-weight: 700; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 700; letter-spacing: -0.03em; }
.lbl { font: 500 12px/1.2 var(--font-body); text-transform: uppercase; letter-spacing: .08em; color: rgba(245, 244, 239, .55); }
.h1d { font: 800 34px/1.08 var(--font-display); letter-spacing: -0.03em; }
.sec-h { font: 800 clamp(30px, 3.2vw, 44px)/1.05 var(--font-display); letter-spacing: -0.03em; }
.icon-tile { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink); flex: none; }
.icon-tile.is-lime { background: var(--lime-dim); color: var(--lime); border-color: rgba(198, 244, 50, .3); }
a .logo, a .logo-word { color: var(--ink); }
.hr-lane { border: 0; border-top: 2px dashed rgba(198, 244, 50, .4); margin: 0; }

/* ── Sidebar ── */
body.d .sidebar-logo .logo-word { font-size: 18px; }
.nav-label { white-space: nowrap; }
.sb-clock { display: flex; flex-direction: column; gap: 6px; }
.sb-time { font: 700 20px/1 var(--font-mono); letter-spacing: -0.02em; }
.sb-off { font: 500 11.5px/1.3 var(--font-mono); color: var(--muted); }
.sb-off.is-shift { color: var(--warn); }
.sb-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 4px; }
.sb-btns button { height: 30px; border-radius: 8px; background: var(--surface-3); font: 600 11.5px/1 var(--font-mono); color: var(--ink-2); }
.sb-btns button:hover { background: var(--lime); color: var(--on-lime); }
.sb-user { display: flex; align-items: center; gap: 10px; padding: 10px 8px 0; color: var(--ink); text-decoration: none; }
.sb-user:hover { text-decoration: none; }
.sb-user .avatar { width: 36px; height: 36px; font-size: 14px; border-radius: 11px; }
@media (max-width: 1180px) {
  body.d .sidebar { width: 76px; padding: 18px 10px 14px; align-items: stretch; }
  body.d .sidebar .nav-label, body.d .sidebar .logo-word, .sb-clock .lbl, .sb-off, .sb-btns, .sb-user-txt { display: none; }
  body.d .sidebar-logo { padding: 0 0 18px; display: flex; justify-content: center; }
  body.d .nav-item { justify-content: center; padding: 0; }
  body.d .nav-badge { position: absolute; top: 3px; right: 3px; min-width: 18px; height: 16px; padding: 0 4px; font-size: 10px; line-height: 16px; }
  .sb-clock { padding: 8px 4px; align-items: center; } .sb-time { font-size: 12px; }
  .sb-user { justify-content: center; padding: 8px 0 0; }
  body.d .toast-host { left: calc(50% + 38px); }
}

/* ── Top bar (app views) ── */
body.d .dtop { height: 72px; flex-wrap: nowrap; }
.dtop-title { font: 700 18px/1.2 var(--font-display); letter-spacing: -0.015em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.dtop-title small { display: block; font: 500 12.5px/1.3 var(--font-body); color: var(--muted); letter-spacing: 0; }
.dtop .spacer { flex: 1; }
.where { position: relative; width: 300px; flex: none; }
.where-sm { width: 240px; }
.where .input { padding-left: 40px; padding-right: 36px; text-overflow: ellipsis; }
.where > .ico { position: absolute; left: 14px; top: 50%; translate: 0 -50%; color: var(--lime); pointer-events: none; }
.where kbd { position: absolute; right: 10px; top: 50%; translate: 0 -50%; font: 600 11px/1 var(--font-mono); color: var(--muted); border: 1px solid var(--line-strong); border-radius: 6px; padding: 3px 6px; pointer-events: none; }
.where-pop { position: absolute; top: calc(100% + 6px); left: 0; width: max(100%, 340px); max-height: 400px; overflow: auto; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 16px; box-shadow: var(--shadow-lift); padding: 6px; z-index: 120; animation: d-rise 200ms var(--e-in) both; }
.where-grp { padding: 10px 10px 4px; }
.where-opt { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 10px; text-align: left; color: var(--ink); }
.where-opt .ico { color: var(--muted); }
.where-opt small { display: block; color: var(--muted); font-size: 12px; }
.where-opt.is-act, .where-opt:hover { background: var(--surface-2); }
.where-opt.is-act .ico { color: var(--lime); }
.whenbtn { height: 48px; display: inline-flex; align-items: center; gap: 10px; padding: 0 14px; border-radius: var(--r-ctl); background: var(--surface-2); border: 1px solid var(--line); white-space: nowrap; transition: border-color 150ms; }
.whenbtn:hover { border-color: var(--line-strong); }
.whenbtn .ico { color: var(--lime); }
.whenbtn b { font: 600 13.5px/1 var(--font-mono); }
.dot-sep { width: 4px; height: 4px; border-radius: 50%; background: var(--muted-2); display: inline-block; }

/* ── Landing ── */
.ld { position: relative; overflow-x: clip; }
.ld-wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 40px; }
.ld-nav { position: absolute; top: 0; left: 0; right: 0; z-index: 30; }
.ld-nav .ld-wrap { height: 80px; display: flex; align-items: center; gap: 28px; }
.ld-nav a.lnk { color: var(--ink-2); font-weight: 500; font-size: 14.5px; }
.ld-nav a.lnk:hover { color: var(--ink); text-decoration: none; }
.ld-hero { position: relative; min-height: min(max(100vh, 720px), 940px); display: flex; isolation: isolate; }
.ld-hero::before { content: ""; position: absolute; inset: 0; z-index: -2; pointer-events: none;
  background-image: linear-gradient(rgba(245, 244, 239, .065) 1px, transparent 1px), linear-gradient(90deg, rgba(245, 244, 239, .065) 1px, transparent 1px);
  background-size: 72px 72px; background-position: -1px -1px; mask-image: radial-gradient(120% 90% at 30% 40%, #000 30%, transparent 85%); -webkit-mask-image: radial-gradient(120% 90% at 30% 40%, #000 30%, transparent 85%); }
.ld-hero .ld-wrap { width: 100%; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: 24px; align-items: stretch; }
.ld-copy { grid-column: 1 / span 5; grid-row: 1; position: relative; z-index: 3; padding: 132px 0 64px; display: flex; flex-direction: column; justify-content: center; }
.ld-h { font: 700 clamp(56px, 7vw, 104px)/.95 var(--font-display); letter-spacing: -0.035em; margin: 18px 0 22px; white-space: nowrap; }
.ld-h span { display: block; }
.ld-sub { font-size: 18px; line-height: 1.55; color: var(--ink-2); max-width: 470px; }
.ld-mapcol { grid-column: 5 / -1; grid-row: 1; position: relative; margin-right: calc(-1 * max(40px, (100vw - var(--wrap)) / 2 + 40px)); z-index: 1; }
.ld-map { position: absolute; inset: -110px 0 0 -280px; border-radius: 0;
  --mk: linear-gradient(90deg, transparent 0, rgba(0,0,0,.35) 16%, #000 34%), linear-gradient(180deg, transparent 190px, #000 340px, #000 82%, transparent 100%);
  mask-image: var(--mk); -webkit-mask-image: var(--mk); mask-composite: intersect; -webkit-mask-composite: source-in; }
.ld-map .map-ctrls, .ld-map .map-scale { display: none; }
.ld-map .map-search-area { display: none !important; }
.ld-live { position: absolute; top: 104px; right: max(40px, calc((100vw - var(--wrap)) / 2 + 40px)); z-index: 4; display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 12px; background: rgba(18, 26, 21, .9); border: 1px solid var(--line-strong); font: 600 12.5px/1 var(--font-body); backdrop-filter: blur(8px); }
.ld-pass { position: absolute; z-index: 4; right: max(48px, calc((100vw - var(--wrap)) / 2 + 56px)); bottom: 72px; width: 290px; animation: pass-in 900ms 500ms var(--e-in) both; transform-origin: 60% 80%; }
.ld-pass .pass { max-width: none; }
.ld-pass .pass-top, .ld-pass .pass-bottom { padding: 16px 18px; }
.ld-pass .pass-bay { font-size: 40px; }
.ld-pass .pass-qr .qr { width: 76px; height: 76px; }
.ld-pass-inner { animation: float-y 6s 1.6s ease-in-out infinite; }
.ld-search { margin-top: 34px; padding: 10px; border-radius: 22px; background: rgba(18, 26, 21, .92); border: 1px solid var(--line-strong); box-shadow: var(--shadow-lift); display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-width: 520px; backdrop-filter: blur(10px); }
.sf { position: relative; display: flex; flex-direction: column; justify-content: center; gap: 5px; min-height: 66px; padding: 10px 14px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); text-align: left; transition: border-color 150ms; }
.sf:hover, .sf:focus-within { border-color: var(--line-strong); }
.sf-where { grid-column: 1 / -1; padding: 0; }
.sf-where .where { width: 100%; }
.sf-where .input { height: 64px; background: transparent; border: 0; font-size: 17px; font-weight: 600; padding-top: 20px; }
.sf-where .lbl { position: absolute; left: 40px; top: 12px; z-index: 1; pointer-events: none; }
.sf .v { font: 600 15px/1.2 var(--font-mono); display: flex; align-items: center; gap: 8px; }
.ld-search .btn-lg { grid-column: 1 / -1; height: 56px; font-size: 16.5px; }
.ld-guar { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 22px; color: var(--ink-2); font-size: 13.5px; }
.ld-guar span { display: inline-flex; align-items: center; gap: 7px; }
.ld-guar .ico { color: var(--lime); }
.ld-sec { padding: 96px 0 0; }
.ld-sec-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 36px; }
.ld-sec-head p { color: var(--ink-2); max-width: 440px; }
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; position: relative; }
.steps::before { content: ""; position: absolute; left: 12%; right: 12%; top: 54px; border-top: 2px dashed rgba(198, 244, 50, .35); z-index: 0; }
.step { position: relative; z-index: 1; padding: 24px; }
.step-n { font: 700 12px/1 var(--font-mono); color: var(--lime); letter-spacing: .14em; }
.step-ico { width: 60px; height: 60px; border-radius: 18px; display: grid; place-items: center; background: var(--forest); border: 1px solid rgba(198, 244, 50, .3); color: var(--lime); margin: 14px 0 18px; }
.step h3 { font: 700 19px/1.25 var(--font-display); letter-spacing: -0.015em; margin-bottom: 6px; }
.step p { color: var(--ink-2); font-size: 14.5px; }
.board { background: #060907; border: 1px solid var(--line-strong); border-radius: 24px; padding: 26px 28px 22px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .04), var(--shadow-lift); }
.board-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-bottom: 16px; border-bottom: 2px dashed rgba(245, 244, 239, .14); font: 700 12px/1 var(--font-mono); letter-spacing: .18em; color: var(--warn); }
.board-head .clock { color: var(--lime); font-size: 15px; letter-spacing: .06em; }
.board-cols, .board-row { display: grid; grid-template-columns: minmax(0, 1.3fr) auto 140px; gap: 24px; align-items: center; }
.board-cols { padding: 14px 0 6px; font: 600 10.5px/1 var(--font-mono); letter-spacing: .16em; color: var(--muted); }
.board-row { padding: 14px 0; border-top: 1px solid rgba(245, 244, 239, .07); }
.board-what { font: 600 15px/1.35 var(--font-body); color: var(--ink); }
.board-what small { display: block; color: var(--muted); font: 500 11.5px/1.4 var(--font-mono); letter-spacing: .04em; margin-top: 3px; }
.flaps { display: flex; gap: 4px; align-items: flex-end; }
.flap { position: relative; width: 38px; height: 54px; border-radius: 6px; background: linear-gradient(#1A211D 0 49%, #121815 51% 100%); display: grid; place-items: center; overflow: hidden; font: 700 32px/1 var(--font-mono); color: #F5F1DC; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .05), 0 2px 0 #000; }
.flap::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1.5px; background: #050706; }
.flap.is-sym { width: 26px; color: var(--lime); }
.flap.is-unit { width: auto; padding: 0 8px; font-size: 15px; color: var(--muted); background: transparent; box-shadow: none; }
.flap.is-unit::after { display: none; }
.odo { display: block; height: 32px; overflow: hidden; }
.odo-strip { display: flex; flex-direction: column; transition: transform 1100ms var(--e-std); transform: translateY(0); }
.odo-strip > i { font-style: normal; height: 32px; line-height: 32px; text-align: center; }
.board-st { justify-self: end; font: 700 12px/1 var(--font-mono); letter-spacing: .12em; padding: 7px 10px; border-radius: 6px; }
.board-st.st-warn { color: var(--warn); background: var(--warn-dim); } .board-st.st-danger { color: var(--danger); background: var(--danger-dim); }
.board-foot { margin-top: 12px; font: 500 11.5px/1.5 var(--font-mono); color: var(--muted-2); }
.ins { padding: 26px; display: flex; flex-direction: column; gap: 14px; }
.ins-tag { font: 700 12px/1 var(--font-mono); color: var(--lime); letter-spacing: .12em; }
.ins h3 { font: 700 22px/1.2 var(--font-display); letter-spacing: -0.02em; }
.ins p { color: var(--ink-2); font-size: 15px; }
.ins-vis { height: 120px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.ins-vis svg { width: 100%; height: 100%; }
.ins-fix { display: flex; gap: 10px; align-items: flex-start; padding-top: 14px; border-top: 1px dashed var(--line-strong); font-size: 14px; }
.ins-fix .ico { color: var(--lime); margin-top: 2px; }
.hmw { padding: 20px; display: flex; flex-direction: column; gap: 10px; min-height: 186px; }
.hmw q { font: 700 17px/1.3 var(--font-display); letter-spacing: -0.01em; quotes: none; }
.hmw .ans { margin-top: auto; display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--lime); font-weight: 600; }
.car-row { display: grid; grid-auto-flow: column; grid-auto-columns: 300px; gap: 20px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding-left: 4px; padding: 4px 40px 24px 4px; margin: 0 calc(-1 * max(40px, (100vw - var(--wrap)) / 2 + 40px)) 0 -4px; scrollbar-width: none; }
.car-row::-webkit-scrollbar { display: none; }
.fc { color: var(--ink); text-decoration: none !important; scroll-snap-align: start; overflow: hidden; display: flex; flex-direction: column; }
.fc .illus-frame { border-radius: 0; aspect-ratio: 16 / 9; }
.fc-body { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.fc-name { font: 700 17px/1.25 var(--font-display); }
.cta-band { margin-top: 96px; padding: 48px; border-radius: 28px; display: grid; grid-template-columns: 1fr auto; gap: 32px; align-items: center; overflow: hidden; }
.ld-foot { margin-top: 96px; padding: 28px 0 40px; }
.ld-foot .row-between { align-items: flex-start; }
.ld-foot a { color: var(--ink-2); }

/* ── Explore / Map split ── */
.split-rail { scroll-behavior: smooth; }
.rail-head { position: sticky; top: -16px; z-index: 6; margin: -16px -16px 14px; padding: 16px 16px 12px; background: rgba(10, 15, 12, .94); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.rail-count { font: 700 18px/1.2 var(--font-display); letter-spacing: -0.02em; }
.rc { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.rc + .rc { margin-top: 12px; }
.rc.is-hot, .rc.is-active { border-color: rgba(198, 244, 50, .5); box-shadow: var(--glow-soft); }
.rc.is-active::before { content: ""; position: absolute; left: -1px; top: 16px; bottom: 16px; width: 3px; border-radius: 0 3px 3px 0; background: var(--lime); }
.rc.is-full { opacity: .72; }
.rc-top { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; gap: 12px; align-items: start; }
.rc-thumb { width: 72px; height: 64px; border-radius: 12px; }
.rc-name { font: 700 16px/1.25 var(--font-display); letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rc-meta { font-size: 12.5px; color: var(--ink-2); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rc-price { text-align: right; }
.rc-price .num { font-size: 28px; line-height: 1; display: block; }
.rc-price .price-unit { display: block; margin-top: 5px; }
.rc-mid { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; }
.amen-row { display: flex; gap: 4px; }
.amen-row .amen-chip { width: 26px; height: 26px; color: var(--ink-2); }
.rc-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.rc-strip > div { background: var(--surface-2); border-radius: 9px; padding: 7px 9px; display: flex; justify-content: space-between; font: 500 12px/1 var(--font-mono); color: var(--muted); }
.rc-strip b { color: var(--ink); font-weight: 600; }
.rc-foot { display: flex; align-items: center; gap: 8px; }
.rc-reason { flex: 1; min-width: 0; font-size: 12.5px; line-height: 1.35; color: var(--lime); display: flex; gap: 6px; align-items: flex-start; }
.rc-reason .ico { margin-top: 1px; }
.rc-reason span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rc-reason.is-full { color: var(--danger); }
.rc .check { min-height: 32px; font-size: 13px; color: var(--ink-2); gap: 7px; }
.rc .check-box { width: 18px; height: 18px; border-radius: 6px; }
.heart { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--ink-2); border: 1px solid var(--line); transition: all 150ms; }
.heart:hover { color: var(--ink); border-color: var(--line-strong); }
.heart.is-on { color: var(--danger); border-color: rgba(255, 90, 95, .35); background: var(--danger-dim); }
.heart.is-on svg { fill: currentColor; }
.split-map { container-type: inline-size; }
.map-preview { position: absolute; right: 20px; bottom: 20px; width: 380px; z-index: 60; padding: 14px; animation: d-rise 320ms var(--e-in) both; background: rgba(18, 26, 21, .97); }
.map-tray { position: absolute; left: 20px; bottom: 20px; z-index: 59; max-width: calc(100% - 440px); }
@container (max-width: 900px) { .map-preview { bottom: 92px; width: min(380px, calc(100% - 40px)); } .map-tray { max-width: calc(100% - 40px); } }
.tray-items { display: flex; gap: 6px; min-width: 0; overflow: hidden; }
.tray-item { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 6px 0 10px; border-radius: 9px; background: var(--surface-3); font-size: 12.5px; white-space: nowrap; max-width: 170px; }
.tray-item span { overflow: hidden; text-overflow: ellipsis; }
.tray-item button { color: var(--muted); display: grid; place-items: center; }
body.d .split.is-mapmode { grid-template-columns: 360px minmax(0, 1fr); transition: grid-template-columns 320ms var(--e-std); }
body.d .split.is-mapmode.rail-closed { grid-template-columns: 0 minmax(0, 1fr); }
.split.rail-closed .split-rail { padding: 0; overflow: hidden; border: 0; }
.rail-toggle { position: absolute; left: 16px; top: 16px; z-index: 61; }
.mr { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px; border-radius: 14px; cursor: pointer; border: 1px solid transparent; }
.mr:hover, .mr.is-hot { background: var(--surface); border-color: var(--line); }
.mr.is-active { background: var(--surface); border-color: rgba(198, 244, 50, .5); }
.mr .thumb { width: 56px; height: 46px; border-radius: 10px; }
.mr .num { font-size: 18px; }

<script>
(function () {
"use strict";
const P = window.PARKLY, { S, A, Router, SvgMap, QR, Dial, Illus, fmt, D, icon, esc, h, $, $$ } = P;
const HOUR = P.HOUR, MIN = P.MIN;
const app = $("#app"), main = $("#main"), sidebar = $("#sidebar");

/* ═════════ small helpers ═════════ */
const st = () => S.state;
const win = () => ({ s: +new Date(st().search.start), e: +new Date(st().search.end) });
const vtype = () => P.defaultVehicle().type;
const money = fmt.money;
const rup = (n) => `<span class="cur">₹</span>${Math.round(n).toLocaleString("en-IN")}`;
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const durMin = () => { const w = win(); return Math.round((w.e - w.s) / MIN); };
const winText = () => { const w = win(); return fmt.windowLabel(w.s, w.e); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const totalFor = (f, s, hours, vt = vtype()) => P.quote({ facility: f, start: s, end: s + hours * HOUR, mode: "hourly", vehicleType: vt }).total;
const dayTotal = (f, s, vt = vtype()) => f.dailyRate ? P.quote({ facility: f, start: s, end: s + 24 * HOUR, mode: "daily", vehicleType: vt }).total : totalFor(f, s, 24, vt);
const measureAll = () => { const r = P.searchFacilities().results; return D.facilities.map((f) => r.find((x) => x.f.id === f.id) || P.measure(f, st().search, st().bookings, st().demo.seed, vtype())); };
const nearestDest = (f) => { const d = [...D.destinations].sort((a, b) => P.distKm(a, f) - P.distKm(b, f))[0]; return { lat: d.lat, lng: d.lng, name: d.name, area: d.area }; };
const gateCode = (b) => String(1000 + Math.floor(P.hash(b.ref) * 9000));
const reduced = () => P.reducedMotion();
const emptyState = (ico, title, text, action = "") => `<div class="empty"><div class="empty-ico">${icon(ico, 28)}</div><h3>${esc(title)}</h3><p class="small" style="max-width:380px">${text}</p>${action}</div>`;

// count-up for prices on first paint (700 ms, tabular mono)
function countUp(el, to, ms = 700) {
  if (!el) return;
  if (reduced()) { el.innerHTML = rup(to); return; }
  const t0 = performance.now(), from = Math.round(to * 0.55);
  const step = (t) => { const k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3); el.innerHTML = rup(from + (to - from) * e); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
// odometer digits: each digit is a 0–9 strip that rolls to its value
function odometer(text) {
  return [...text].map((c) => /\d/.test(c)
    ? `<span class="flap"><span class="odo"><span class="odo-strip" data-d="${c}">${"0123456789".split("").map((d) => `<i>${d}</i>`).join("")}</span></span></span>`
    : c === " " ? `<span style="width:8px"></span>` : `<span class="flap is-sym">${esc(c)}</span>`).join("");
}
function rollOdometers(root) { $$(".odo-strip", root).forEach((s, i) => { s.style.transitionDelay = i * 70 + "ms"; s.style.transform = `translateY(-${+s.dataset.d * 32}px)`; }); }

// scroll reveal (landing)
let io = null;
function observeReveal(root) {
  const els = $$(".sr", root);
  if (reduced() || typeof IntersectionObserver === "undefined") { els.forEach((e) => e.classList.add("is-in")); return; }
  io = new IntersectionObserver((ents) => ents.forEach((en) => { if (en.isIntersecting) { en.target.classList.add("is-in"); en.target.dispatchEvent(new Event("reveal")); io.unobserve(en.target); } }), { threshold: 0.18 });
  els.forEach((e) => io.observe(e));
}

/* ═════════ shared pieces ═════════ */
// Where combobox: destinations, Near me, saved places, recents. onPick(dest) after the store is updated.
function whereBox(cls = "", placeholder = "Where are you going?") {
  const c = P.searchCenter(st().search);
  return `<div class="where ${cls}" data-where>${icon("map-pin", 18)}<input class="input js-where" autocomplete="off" spellcheck="false" placeholder="${placeholder}" value="${esc(c.name)}" aria-label="Destination" role="combobox" aria-expanded="false"><kbd>/</kbd></div>`;
}
function bindWhere(root, onPick) {
  $$("[data-where]", root).forEach((box) => {
    const inp = $("input", box);
    let pop = null, idx = 0, opts = [];
    const close = () => { if (pop) { pop.remove(); pop = null; inp.setAttribute("aria-expanded", "false"); } };
    const build = () => {
      const q = inp.value.trim().toLowerCase(), s = st(), center = P.searchCenter(s.search), typing = q && q !== center.name.toLowerCase();
      const dests = D.destinations.filter((d) => !typing || (d.name + " " + d.area).toLowerCase().includes(q));
      const groups = [];
      if (!typing) {
        groups.push(["", [{ k: "near", ico: "locate-fixed", name: "Near me", sub: "Use my location" }]]);
        groups.push(["Saved places", s.savedPlaces.map((p) => { const d = P.destination(p.destId); return { k: d.id, ico: p.label === "Home" ? "house" : "briefcase", name: p.label, sub: d.name }; })]);
        if (s.recentDest.length) groups.push(["Recent", s.recentDest.map(P.destination).filter(Boolean).map((d) => ({ k: d.id, ico: "clock", name: d.name, sub: d.area }))]);
        groups.push(["All places", dests.map((d) => ({ k: d.id, ico: "map-pin", name: d.name, sub: d.area }))]);
      } else groups.push(["Places", dests.map((d) => ({ k: d.id, ico: "map-pin", name: d.name, sub: `${d.area} · ${d.kind || ""}` }))]);
      opts = groups.flatMap((g) => g[1]);
      idx = clamp(idx, 0, Math.max(0, opts.length - 1));
      let n = 0;
      const html = opts.length ? groups.filter((g) => g[1].length).map(([t, list]) => `${t ? `<div class="where-grp lbl">${t}</div>` : ""}${list.map((o) => `<button class="where-opt ${n === idx ? "is-act" : ""}" data-i="${n++}" type="button">${icon(o.ico, 16)}<span>${esc(o.name)}<small>${esc(o.sub)}</small></span></button>`).join("")}`).join("")
        : `<div class="p-16 small muted">No place matches “${esc(inp.value)}”. Try Connaught Place, Saket or Airport.</div>`;
      if (!pop) { pop = h(`<div class="where-pop" role="listbox"></div>`); box.appendChild(pop); inp.setAttribute("aria-expanded", "true"); pop.addEventListener("mousedown", (e) => e.preventDefault()); }
      pop.innerHTML = html;
      $$(".where-opt", pop).forEach((b) => b.onclick = () => pick(+b.dataset.i));
    };
    const pick = (i) => {
      const o = opts[i]; if (!o) return;
      if (o.k === "near") { A.nearMe(); P.toast("Using your location: Mandi House", "info"); } else A.setDestination(o.k);
      inp.value = P.searchCenter(st().search).name; close(); inp.blur();
      onPick && onPick();
    };
    inp.addEventListener("focus", () => { inp.select(); idx = 0; build(); });
    inp.addEventListener("input", () => { idx = 0; build(); });
    inp.addEventListener("blur", () => setTimeout(() => { close(); inp.value = P.searchCenter(st().search).name; }, 120));
    inp.addEventListener("keydown", (e) => {
      if (e.key === "ArrowDown") { e.preventDefault(); idx = Math.min(opts.length - 1, idx + 1); build(); $(".is-act", pop)?.scrollIntoView({ block: "nearest" }); }
      else if (e.key === "ArrowUp") { e.preventDefault(); idx = Math.max(0, idx - 1); build(); $(".is-act", pop)?.scrollIntoView({ block: "nearest" }); }
      else if (e.key === "Enter") { e.preventDefault(); pick(idx); }
      else if (e.key === "Escape") { e.stopPropagation(); close(); inp.blur(); }
    });
  });
}
// "When" modal: day strip + Enter after + quick lengths + dial for duration. onDone() after setSearch.
function openWhen(onDone) {
  const w = win(), now = P.now();
  let day = P.startOfDay(w.s), tk = P.timeKey(w.s), dur = clamp(Math.round((w.e - w.s) / MIN), 30, 1440);
  const startMs = () => P.at(P.dateKey(day), tk).getTime();
  const times = () => P.TIMES.filter((t) => P.at(P.dateKey(day), t).getTime() >= P.ceilHalfHour(P.now()) || P.startOfDay(P.now()) !== day);
  const days = Array.from({ length: 10 }, (_, i) => P.addDays(P.startOfDay(now), i));
  const body = h(`<div class="when-grid">
      <div class="stack-16">
        <div><div class="lbl mb-8">Day</div><div class="datestrip">${days.map((d) => `<button type="button" data-day="${d}" class="${d === day ? "is-on" : ""}"><small>${i18day(d)}</small><b>${new Date(d).getDate()}</b></button>`).join("")}</div></div>
        <div class="field"><label class="lbl" for="w-tk">Enter after</label><select class="select" id="w-tk"></select></div>
        <div><div class="lbl mb-8">How long</div><div class="chip-row" id="w-chips">${[1, 2, 3, 4, 6, 8, 12].map((x) => `<button type="button" class="chip chip-sm" data-h="${x}">${x} h</button>`).join("")}</div></div>
        <div class="notice notice-info" id="w-sum">${icon("clock", 16)}<span></span></div>
      </div>
      <div><div class="dial" id="w-dial"></div><p class="tiny muted center mt-8">Drag the knob, or use the arrow keys</p></div>
    </div>`);
  const sel = $("#w-tk", body);
  const fillTimes = () => { const ts = times(); if (!ts.includes(tk)) tk = ts[0] || "10:00"; sel.innerHTML = ts.map((t) => `<option value="${t}" ${t === tk ? "selected" : ""}>${fmt.time12(t)}</option>`).join(""); };
  const sync = () => {

        .map(([k, l, sub]) => `<label class="switch switch-row" style="padding:6px 0"><span><span class="strong">${l}</span>${sub ? `<br><span class="tiny muted">${sub}</span>` : ""}</span><input type="checkbox" data-sw="${k}" ${n[k] ? "checked" : ""}><span class="switch-track"></span></label>`).join("")}</div>`;
    $$("[data-k]", body).forEach((b) => b.onclick = () => {

      ["Security", (c) => c.f.security.length, "max", (c) => c.f.security.map((x) => D.securityLabels[x]).join(", ")],
      ["EV charging", (c) => (c.f.ev ? c.f.ev.count : 0), "max", (c) => (c.f.ev ? `${c.f.ev.count} × ${c.f.ev.kw} kW` : `<span class="muted">No</span>`)],
      ["Height limit", null, null, (c) => (c.f.heightLimit ? `${c.f.heightLimit} m` : "No limit")],
      ["Cancellation", (c) => ({ flexible: 3, moderate: 2, strict: 1 }[c.f.policy]), "max", (c) => `${c.pol.title}<div class="tiny muted">${esc(c.pol.rules[0])}</div>`],
    ];
    const tick = `<span class="tick">${icon("check", 13)}</span>`;
    return `${topbar({ title: "Compare" })}<div class="page"><div class="page-head"><div><h1 class="h1d">Compare ${cols.length} places</h1><p>${esc(winText())} · ${esc(P.defaultVehicle().name)}. Lime cells are the best value in each row.</p></div><button class="btn btn-ghost btn-md" data-clear>${icon("trash", 16)}Clear all</button></div>
      <div class="card" style="overflow:hidden"><table class="cmp"><thead><tr><th></th>${cols.map((c) => `<th><div class="illus-frame">${Illus.facility(c.f)}</div><a class="h3" href="#/parking/${c.f.id}" style="color:var(--ink)">${esc(c.f.name)}</a><div class="small muted">${esc(c.f.area)}</div></th>`).join("")}</tr></thead>
      <tbody>${rows.map(([label, val, dir, cell]) => { let best = null; if (val) { const vs = cols.map(val); const b = dir === "min" ? Math.min(...vs) : Math.max(...vs); if (vs.filter((x) => x === b).length < vs.length) best = b; }
        return `<tr><th scope="row">${label}</th>${cols.map((c) => `<td class="${best !== null && val(c) === best ? "is-best" : ""}">${cell(c)}${best !== null && val(c) === best ? tick : ""}</td>`).join("")}</tr>`; }).join("")}
      <tr><th></th>${cols.map((c) => `<td><div class="row gap-8"><button class="btn btn-primary btn-md grow" data-res="${c.f.id}" ${c.m.free <= 0 ? "disabled" : ""}>${c.m.free > 0 ? "Reserve" : "Full"}</button><button class="btn btn-ghost btn-icon btn-md" data-rm="${c.f.id}" aria-label="Remove">${icon("x", 17)}</button></div></td>`).join("")}</tr></tbody></table></div></div>`;
  },
  mount(root) {
    bindTop(root);
    $$("[data-res]", root).forEach((b) => b.onclick = () => { draft = null; Router.go("/reserve/" + b.dataset.res); });
    $$("[data-rm]", root).forEach((b) => b.onclick = () => A.toggleCompare(b.dataset.rm));
    const c = $("[data-clear]", root); if (c) c.onclick = () => A.clearCompare();
  },
};

/* ── 10. NOTIFICATIONS ── */
const N_ICON = { confirmed: "calendar-check", availability: "sparkles", reminder: "alarm-clock", cancelled: "circle-x", price: "tag", extended: "timer", modified: "pencil", ending: "triangle-alert" };
Views.notifications = {
  title: "Notifications · PARKLY",
  render() {
    const list = st().notifications, unread = P.unreadCount();
    return `${topbar({ title: "Notifications" })}<div class="page" style="max-width:900px"><div class="page-head"><div><h1 class="h1d">Notifications</h1><p>${unread ? `${unread} unread` : "You're all caught up"}</p></div>
      <div class="row gap-8">${unread ? `<button class="btn btn-secondary btn-md" data-all>${icon("check-check", 16)}Mark all read</button>` : ""}${list.length ? `<button class="btn btn-ghost btn-md" data-clear>${icon("trash", 16)}Clear all</button>` : ""}</div></div>
      <div class="card">${list.length ? list.map((n) => `<div class="nt ${n.read ? "" : "is-unread"}" data-n="${n.id}"><div class="icon-tile ${n.read ? "" : "is-lime"}" ${n.kind === "ending" || n.kind === "cancelled" ? 'style="color:var(--warn)"' : ""}>${icon(N_ICON[n.kind] || "bell", 18)}</div>
        <div><div class="nt-title">${esc(n.title)}</div><div class="small ink-2">${esc(n.body)}</div><div class="tiny muted mono mt-4">${fmt.ago(n.at)}</div></div>
        <div class="nt-acts">${n.read ? "" : `<button class="btn btn-ghost btn-icon btn-sm" data-read="${n.id}" aria-label="Mark read" title="Mark read">${icon("check", 16)}</button>`}<button class="btn btn-ghost btn-icon btn-sm" data-del="${n.id}" aria-label="Delete" title="Delete">${icon("trash", 16)}</button></div></div>`).join("")
        : emptyState("bell-off", "No notifications", "Booking updates, reminders and price alerts will show up here.")}</div></div>`;
  },
  mount(root) {
    bindTop(root);
    $$("[data-n]", root).forEach((r) => r.onclick = (e) => { if (e.target.closest("button")) return; const n = st().notifications.find((x) => x.id === r.dataset.n); A.markRead(n.id); if (n.bookingId && P.getBooking(n.bookingId)) Router.go("/bookings/" + n.bookingId); else if (n.facilityId) Router.go("/parking/" + n.facilityId); });
    $$("[data-read]", root).forEach((b) => b.onclick = () => A.markRead(b.dataset.read));
    $$("[data-del]", root).forEach((b) => b.onclick = () => A.removeNotification(b.dataset.del));
    const a = $("[data-all]", root); if (a) a.onclick = () => A.markAllRead();
    const c = $("[data-clear]", root); if (c) c.onclick = async () => { if (await P.confirmDialog({ title: "Clear all notifications?", body: "This removes every notification. Your bookings are not affected.", confirm: "Clear all", tone: "danger", cancel: "Keep them" })) A.clearNotifications(); };
  },
};

/* ── 11. PROFILE ── */
const prof = { taps: 0, dev: false };
const FAQ = [
  ["Is my space really guaranteed?", "Yes. When you book, a bay is held for your exact time. If the lot can't give you a space, you get a full refund and ₹100 credit."],
  ["What if I arrive late?", "Your bay is held for your whole booking. You can enter any time between your entry and exit time."],
  ["What if I stay longer?", "Extend from the booking page before your time ends. If you overstay, there are 15 free minutes, then each started hour costs 1.5× the rate."],
  ["How do refunds work?", "It depends on the lot's policy: Flexible, Moderate or Strict. The exact refund is shown before you confirm a cancellation. The ₹18 convenience fee is not refunded."],
  ["Can I change my car or time?", "Yes, for upcoming bookings. You'll see the price difference before you save."],
];
Views.profile = {
  title: "Profile · PARKLY",
  render() {
    const s = st(), off = s.demo.clockOffsetMin, nx = s.prefs.notify;
    const sw = (k, label, sub, on, attr = "data-nf") => `<label class="switch switch-row" style="padding:6px 0"><span><span class="strong">${label}</span>${sub ? `<br><span class="tiny muted">${sub}</span>` : ""}</span><input type="checkbox" ${attr}="${k}" ${on ? "checked" : ""}><span class="switch-track"></span></label>`;
    return `${topbar({ title: "Profile" })}<div class="page"><div class="two-col" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)">
    <div class="stack-24">
      <section class="card prof-user"><span class="avatar">${esc(s.user.name[0])}</span><div class="grow"><div class="h2">${esc(s.user.name)}</div><div class="small muted">${esc(s.user.email)} · ${esc(s.user.phone)}</div></div>${P.badge(`${s.bookings.length} bookings`, "lime")}</section>
      <section class="card sec-card"><div class="card-head"><h2 class="card-title">Vehicles</h2><button class="btn btn-secondary btn-sm" data-addv>${icon("plus", 15)}Add</button></div>
        <div class="list">${s.vehicles.map((v) => `<div class="list-row" style="padding-inline:0"><span class="ico-wrap">${icon(v.type === "motorcycle" ? "bike" : v.type === "ev" ? "zap" : "car", 18)}</span><div class="grow"><b>${esc(v.name)}</b> ${v.id === s.defaultVehicleId ? P.badge("Default", "lime") : ""}<div class="row gap-8 mt-4" style="flex-wrap:wrap">${P.plate(v.plate, "sm")}<span class="tiny muted">${D.vehicleLabels[v.type]}</span></div></div>
          ${v.id === s.defaultVehicleId ? "" : `<button class="btn btn-ghost btn-sm" data-def="${v.id}">Make default</button>`}<button class="btn btn-ghost btn-icon btn-sm" data-editv="${v.id}" aria-label="Edit">${icon("pencil", 15)}</button><button class="btn btn-ghost btn-icon btn-sm" data-rmv="${v.id}" aria-label="Remove">${icon("trash", 15)}</button></div>`).join("")}</div></section>
      <section class="card sec-card"><h2 class="card-title mb-12">Payment</h2><div class="seg seg-block">${D.paymentMethods.map((m) => `<button class="${s.prefs.payment === m.id ? "is-on" : ""}" data-pm="${m.id}">${esc(m.label)}</button>`).join("")}</div><p class="small muted mt-12">${esc((D.paymentMethods.find((m) => m.id === s.prefs.payment) || {}).detail || "")} is used by default at checkout.</p></section>
      <section class="card sec-card"><h2 class="card-title mb-12">Saved places</h2>${s.savedPlaces.map((p) => `<div class="field mb-12"><label class="lbl">${icon(p.label === "Home" ? "house" : "briefcase", 14)} ${esc(p.label)}</label><select class="select" data-sp="${p.id}">${D.destinations.map((d) => `<option value="${d.id}" ${d.id === p.destId ? "selected" : ""}>${esc(d.name)}</option>`).join("")}</select></div>`).join("")}</section>
    </div>
    <div class="stack-24">
      <section class="card sec-card"><h2 class="card-title mb-8">Notifications</h2>${sw("reminders", "Booking reminders", "1 hour before entry and 15 minutes before exit", nx.reminders)}${sw("updates", "Booking updates", "Confirmations, changes and refunds", nx.updates)}${sw("priceAlerts", "Price alerts", "From your saved searches", nx.priceAlerts)}${sw("availability", "Space alerts", "When saved spots free up", nx.availability)}</section>
      <section class="card sec-card"><h2 class="card-title mb-8">Display</h2>${sw("largeText", "Larger text", "Easier to read", s.prefs.largeText, "data-pf")}${sw("reduceMotion", "Reduce motion", "Turns off moving effects", s.prefs.reduceMotion, "data-pf")}</section>
      <section class="card sec-card dev" id="dev" ${prof.dev || off || s.demo.nextPaymentFails ? "" : "hidden"}><div class="card-head"><h2 class="card-title">${icon("sliders-horizontal", 17)} Developer options</h2>${P.badge("Demo only", "warn")}</div>
        <div class="row-between mb-16"><div><div class="lbl">Test clock</div><div class="dev-clock mt-4" id="dev-clock">${fmt.dayLabel(P.now())}, ${fmt.timeLabel(P.now())}</div><div class="tiny mono ${off ? "t-warn" : "muted"} mt-4">${off ? `${off > 0 ? "+" : "−"}${fmt.durationShort(Math.abs(off))} from real time` : "Real time"}</div></div></div>
        <div class="chip-row mb-16"><button class="chip chip-sm" data-adv="30">+30 min</button><button class="chip chip-sm" data-adv="60">+1 hour</button><button class="chip chip-sm" data-adv="180">+3 hours</button><button class="chip chip-sm" data-jump>Jump to 10 min before next event</button><button class="chip chip-sm" data-real>Back to real time</button></div>
        ${sw("nextPaymentFails", "Fail the next payment", "Checkout will show the payment-failed screen once", s.demo.nextPaymentFails, "data-demo")}
        <div class="row gap-8 mt-12"><button class="btn btn-secondary btn-sm" data-refresh>${icon("refresh-cw", 15)}Refresh availability</button><button class="btn btn-danger btn-sm" data-reset>${icon("rotate-ccw", 15)}Reset all data</button></div></section>
      <section class="card sec-card"><h2 class="card-title mb-4">Help</h2>${FAQ.map(([q, a]) => `<details class="faq"><summary>${esc(q)}${icon("chevron-down", 16)}</summary><p>${esc(a)}</p></details>`).join("")}</section>
      <section class="card sec-card row-between"><div class="row gap-16 small"><button class="link" data-doc="terms">Terms of use</button><button class="link" data-doc="privacy">Privacy</button></div><span class="mono tiny muted ver" data-ver title="Tap 5 times for developer options">PARKLY v1.0 (desktop)</span><button class="btn btn-ghost btn-sm" data-out>${icon("log-out", 15)}Sign out</button></section>
    </div></div></div>`;
  },
  mount(root, route, ctx) {
    bindTop(root);
    const on = (sel, fn) => $$(sel, root).forEach((x) => x.addEventListener(x.matches("input,select") ? "change" : "click", () => fn(x)));
    on("[data-addv]", () => vehicleModal(null));
    on("[data-editv]", (b) => vehicleModal(st().vehicles.find((v) => v.id === b.dataset.editv)));
    on("[data-rmv]", async (b) => { const v = st().vehicles.find((x) => x.id === b.dataset.rmv); if (await P.confirmDialog({ title: `Remove ${v.name}?`, body: `${esc(v.plate)} will be removed from your profile.`, confirm: "Remove", tone: "danger", cancel: "Keep" })) { const r = A.removeVehicle(v.id); P.toast(r.ok ? "Vehicle removed" : r.error, r.ok ? "ok" : "warn"); } });
    on("[data-def]", (b) => { A.setDefaultVehicle(b.dataset.def); P.toast("Default vehicle changed. Prices now use this car.", "ok"); });
    on("[data-pm]", (b) => A.setPrefs({ payment: b.dataset.pm }));
    on("[data-sp]", (x) => { A.setSavedPlace(x.dataset.sp, x.value); P.toast("Saved place updated", "ok"); });
    on("[data-nf]", (x) => A.setNotify({ [x.dataset.nf]: x.checked }));
    on("[data-pf]", (x) => A.setPrefs({ [x.dataset.pf]: x.checked }));
    on("[data-demo]", (x) => { A.setDemo({ [x.dataset.demo]: x.checked }); P.toast(x.checked ? "The next payment will fail" : "Payments work normally", "info"); });
    on("[data-adv]", (b) => { A.advanceClock(+b.dataset.adv); P.toast(`Clock moved ${fmt.durationShort(+b.dataset.adv)} ahead`, "info"); });
    on("[data-jump]", () => { const r = A.jumpToNextEvent(); P.toast(r || "No upcoming or active booking to jump to", r ? "info" : "warn"); });
    on("[data-real]", () => { A.setClockOffset(0); P.toast("Back to real time", "info"); });
    on("[data-refresh]", () => { A.refreshAvailability(); P.toast("Availability refreshed", "ok"); });
    on("[data-reset]", async () => { if (await P.confirmDialog({ title: "Reset all data?", body: "Bookings, vehicles and settings go back to the demo start. This can't be undone.", confirm: "Reset", tone: "danger" })) { A.resetDemo(); draft = null; P.toast("Demo data reset", "ok"); } });
    on("[data-ver]", () => { if (++prof.taps >= 5 && !prof.dev) { prof.dev = true; $("#dev", root).hidden = false; $("#dev", root).scrollIntoView({ behavior: "smooth", block: "center" }); P.toast("Developer options unlocked", "ok"); } });
    on("[data-doc]", (b) => P.openSheet({ title: b.dataset.doc === "terms" ? "Terms of use" : "Privacy", body: `<div class="stack-12 ink-2 small">${(b.dataset.doc === "terms"
      ? ["PARKLY is a design prototype. No real bookings or payments are made.", "Prices include the convenience fee and 18% GST. The convenience fee is not refunded.", "Overstay: 15 minutes' grace, then every started hour at 1.5× the hourly rate.", "Refunds follow each lot's cancellation policy, shown before you pay."]
      : ["This prototype stores your demo data only in this browser (localStorage).", "Nothing is sent to a server. Clearing site data or Reset removes it.", "Location is simulated: Near me always uses Mandi House."]).map((x) => `<p>${x}</p>`).join("")}</div>` }));
    on("[data-out]", async () => { if (await P.confirmDialog({ title: "Sign out?", body: "Your demo bookings stay on this device.", confirm: "Sign out" })) { A.signOut(); Router.go("/"); } });
    ctx.every(1000, () => { const c = $("#dev-clock", root); if (c) c.textContent = `${fmt.dayLabel(P.now())}, ${fmt.timeLabel(P.now())}`; });
  },
  onState(s, why, prev) { if (why === "tick" || why === "notify") return; rerender(); },
};


/* ═════════ router + lifecycle ═════════ */
const VIEW_OF = { landing: "landing", welcome: "landing", explore: "explore", map: "map", parking: "parking", reserve: "reserve", checkout: "checkout", confirmation: "confirmation",
  bookings: "bookings", booking: "bookings", arrive: "bookings", saved: "saved", compare: "compare", notifications: "notifications", profile: "profile" };
function mountRoute(route, prev) {
  if (route.name === "welcome") { Router.replace("/"); return; }
  if (cur) { cur.cleanups.forEach((fn) => { try { fn(); } catch (e) { console.error(e); } }); if (io) { io.disconnect(); io = null; } }
  const key = VIEW_OF[route.name], V = Views[key];
  app.classList.toggle("no-sidebar", key === "landing");
  const ctx = { cleanups: [], on(fn) { this.cleanups.push(fn); }, every(ms, fn) { const t = setInterval(fn, ms); this.cleanups.push(() => clearInterval(t)); } };
  cur = { name: key, route, V, ctx, cleanups: ctx.cleanups };
  if (!V) { main.innerHTML = `${topbar({ title: "Page not found" })}<div class="page">${emptyState("map-pin", "This page doesn't exist", "The link may be old. Start a new search instead.", `<a class="btn btn-primary btn-md" href="#/explore">Find parking</a>`)}</div>`; bindTop(main); renderSidebar(); return; }
  main.innerHTML = V.render(route, ctx);
  try { V.mount && V.mount(main, route, ctx); } catch (e) { console.error(e); }
  document.title = typeof V.title === "function" ? V.title(route) : V.title || "PARKLY";
  renderSidebar();
}
function rerender() { if (!cur) return; const y = window.scrollY; mountRoute(cur.route); window.scrollTo(0, y); }
S.subscribe((s, why, prev) => {
  renderSidebar();
  if (!cur || !cur.V) return;
  if (why === "reset") { rerender(); return; }
  if (cur.V.onState) { try { cur.V.onState(s, why, prev, main, cur.ctx); } catch (e) { console.error(e); } }
  else rerender();
});
setInterval(() => { const t = $("#sb-time"); if (t) t.textContent = fmt.timeLabel(P.now()); }, 5000);

/* ═════════ global keys + magnetic buttons ═════════ */
document.addEventListener("keydown", (e) => {
  const tag = (e.target.tagName || "").toLowerCase(), typing = tag === "input" || tag === "textarea" || tag === "select" || e.target.isContentEditable;
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "/") {
    e.preventDefault();
    const i = $(".js-where", main);
    if (i) i.focus(); else Router.go("/explore");
    return;
  }
  const mp = cur && cur.ctx.map;
  if (mp && ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "+", "=", "-"].includes(e.key) && !$(".overlay") && !e.target.closest(".dial,.map")) {
    if (cur.name === "landing") return;
    e.preventDefault(); mp.el.dispatchEvent(new KeyboardEvent("keydown", { key: e.key, bubbles: false }));
  }
});
document.addEventListener("pointermove", (e) => {
  if (reduced()) return;
  $$(".btn.is-mag").forEach((b) => {
    const r = b.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2, dx = e.clientX - cx, dy = e.clientY - cy;
    const near = Math.abs(dx) < r.width / 2 + 30 && Math.abs(dy) < r.height / 2 + 30;
    b.style.translate = near && !b.disabled ? `${clamp(dx * 0.12, -6, 6).toFixed(1)}px ${clamp(dy * 0.25, -6, 6).toFixed(1)}px` : "";
  });
}, { passive: true });

Router.on(mountRoute);
Router.start();
window.PARKLY_DESKTOP = { Views, rerender };
})();
</script>
</body>
</html>
